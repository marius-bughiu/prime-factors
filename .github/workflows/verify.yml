name: Verify and publish
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch the pinned dependencies and relevant compiled Mathlib modules
        run: sh scripts/fetch-cache.sh
      - name: Check library and audit project axioms
        run: |
          lake build
          lake env lean scripts/Audit.lean
      - name: Run search tests
        run: python3 -m unittest discover -s tests
      - name: Discover factors and kernel-check certificates
        run: python3 scripts/benchmark.py
      - name: Regenerate and verify the independently constructed comparison input
        run: python3 -m experiments.certified_control --verify
      - name: Verify factor-search bounds on the two full-size inputs
        run: |
          python3 -m experiments.many_character_receipt --verify
          python3 -m experiments.split_prime_receipt
          python3 -m experiments.affine_prime_signs
          python3 -m experiments.projected_wheel_receipt --check
          lake env lean benchmarks/controls/ProjectedWheelPrivate.lean
          python3 -m experiments.three_target_limits
          python3 -m experiments.negative_menu_control --check
          python3 -m experiments.divisor_weight_sectors --check
          python3 -m experiments.rectangular_winner_receipt
          python3 -m experiments.trace_population_receipt
          python3 -m experiments.intermediate_menu_receipt --check
          python3 -m experiments.intermediate_private_shift_receipt --check
          python3 -m experiments.full_width_totient_divisor --check
          python3 -m experiments.fixed_window_digit_packing --check
          python3 -m experiments.high_word_sum_ranking --check
          python3 -m experiments.high_word_suffix_ranking --check
          python3 -m experiments.fractional_word_ranking --check
          python3 -m experiments.word_ranking_tail
      - name: Generate progress report
        run: python3 scripts/render_site.py
      - name: Upload verified main artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Read the guard from the verified commit and capture main's history under the lock.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a newer verified main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages_revision.py
      - name: Deploy verified progress report
        if: steps.revision.outputs.eligible == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
