name: Verify and publish
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Set compatible cache keys
        id: keys
        if: github.event_name != 'workflow_dispatch'
        env:
          PINS: ${{ hashFiles('lean-toolchain', 'lakefile.*', 'lake-manifest.json', 'scripts/ci_lean_build.py', 'scripts/fetch-cache.sh') }}
        run: |
          set -o pipefail
          source /etc/os-release
          platform="$RUNNER_OS-$RUNNER_ARCH-$ID-$VERSION_ID"
          lean="lean-project-v1-$platform-$PINS-"
          python_version=$(python3 -c 'import platform; print(platform.python_version())')
          checks="verified-checks-v2-$platform-py$python_version-$PINS-"
          # Git tree identities include filenames, so module renames change the key.
          sources=$(git rev-parse HEAD:PrimeFactors HEAD:PrimeFactors.lean | sha256sum | cut -d' ' -f1)
          {
            echo "lean-prefix=$lean"
            echo "lean-key=$lean$sources"
            echo "checks-prefix=$checks"
            echo "checks-key=$checks$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Restore compiled project modules
        id: lean-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.keys.outputs.lean-key }}
          restore-keys: ${{ steps.keys.outputs.lean-prefix }}
      - name: Restore individually verified results
        id: checks-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verification-cache
          key: ${{ steps.keys.outputs.checks-key }}
          restore-keys: ${{ steps.keys.outputs.checks-prefix }}
      - name: Record restored verification state
        id: previous
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.checks-cache.outputs.cache-hit != 'true'
        env:
          DIGEST: ${{ hashFiles('build/verification-cache/**') }}
        run: echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned dependencies and relevant compiled Mathlib modules
        run: sh scripts/fetch-cache.sh
      - name: Check library and audit project axioms
        run: |
          python3 scripts/ci_lean_build.py
          lake build
          lake env lean scripts/Audit.lean
      - name: Verify tests, benchmark certificates and research receipts
        env:
          FULL_REPLAY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set --
          if [[ "$FULL_REPLAY" != true ]]; then set -- --cache-dir build/verification-cache; fi
          python3 scripts/verify_checks.py --group tests "$@"
          python3 scripts/benchmark.py "$@"
          python3 scripts/verify_checks.py --group receipts "$@"
      - name: Generate progress report
        run: python3 scripts/render_site.py
      - name: Upload verified main artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site
      - name: Save verified project build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.keys.outputs.lean-key }}
      - name: Save updated verification records
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.checks-cache.outputs.cache-hit != 'true' && steps.previous.outputs.digest != hashFiles('build/verification-cache/**')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verification-cache
          key: ${{ steps.keys.outputs.checks-key }}

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Read the guard from the verified commit and capture main's history under the lock.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a newer verified main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages_revision.py
      - name: Deploy verified progress report
        if: steps.revision.outputs.eligible == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
