name: Verify and publish
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch the pinned dependencies and relevant compiled Mathlib modules
        run: sh scripts/fetch-cache.sh
      - name: Check library and audit project axioms
        run: |
          lake build
          lake env lean scripts/Audit.lean
      - name: Run search tests
        run: python3 -m unittest discover -s tests
      - name: Discover factors and kernel-check certificates
        run: python3 scripts/benchmark.py
      - name: Generate progress report
        run: python3 scripts/render_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Verification runs may finish out of order. Check main after acquiring
      # the deployment lock so an older artifact cannot replace a newer one.
      - name: Compare the verified revision with main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment of $GITHUB_SHA because main is $head_sha."
          fi
      - name: Deploy verified progress report
        if: steps.revision.outputs.current == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
